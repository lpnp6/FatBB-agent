# Navigation labels and order for the interactive terminal UI.

[cli]
home_page = "chat"
palette_page = "palette"

[menus.palette]
items = [
  { value = "knowledge_base", label = "Knowledge Base", handler = "fatbb.cli.actions:open_knowledge_base_menu" },
  { value = "back", label = "Back", handler = "fatbb.cli.actions:return_to_chat" },
]

[menus.knowledge_base]
items = [
  { value = "select_existing", label = "Select existing", handler = "fatbb.cli.actions:open_existing_knowledge_bases" },
  { value = "create_new", label = "Create new", handler = "fatbb.cli.actions:open_knowledge_base_creation" },
  { value = "back", label = "Back", handler = "fatbb.cli.actions:return_to_chat" },
]

[menus.retrieval_type]
items = [
  { value = "bm25", label = "BM25" },
  { value = "vector", label = "Vector" },
  { value = "back", label = "Back" },
]

[menus.database_type]
items = [
  { value = "pg", label = "PostgreSQL" },
  { value = "back", label = "Back" },
]

[menus.embedding_provider]
items = [
  { value = "ollama", label = "Ollama" },
  { value = "back", label = "Back" },
]

[menus.embedding_model]
items = [
  { value = "nomic-embed-text", label = "nomic-embed-text" },
  { value = "back", label = "Back" },
]

[menus.source_type]
items = [
  { value = "file_path", label = "File path" },
  { value = "back", label = "Back" },
]

# Pages select an item source. They do not name Python methods, so the config
# remains presentation data while the controller keeps trusted providers.
[item_sources.existing_knowledge_bases]
handler = "fatbb.cli.item_sources:existing_knowledge_bases"

[pages.palette]
menu = "palette"
interaction = "menu"
submit_action = "palette_selection"

[pages.chat]
interaction = "chat"
submit_action = "retrieve"

[pages.knowledge_base_menu]
menu = "knowledge_base"
interaction = "menu"
submit_action = "knowledge_base_menu_selection"

[pages.existing_knowledge_bases]
item_source = "existing_knowledge_bases"
interaction = "menu"
submit_action = "select_knowledge_base"

[pages.retrieval_type]
menu = "retrieval_type"
interaction = "menu"
submit_action = "set_retrieval_type"

[pages.database_type]
menu = "database_type"
interaction = "menu"
submit_action = "set_database_type"

[pages.database_url]
interaction = "text"
submit_action = "set_database_url"
hint = "Enter a database connection URL. It will be stored with the knowledge base."

[pages.embedding_provider]
menu = "embedding_provider"
interaction = "menu"
submit_action = "set_embedding_provider"

[pages.embedding_model]
menu = "embedding_model"
interaction = "menu"
submit_action = "set_embedding_model"

[pages.embedding_url]
interaction = "text"
submit_action = "set_embedding_url"
hint = "Enter the Ollama URL, for example http://localhost:11434."

[pages.source_type]
menu = "source_type"
interaction = "menu"
submit_action = "set_source_type"

[pages.knowledge_base_name]
interaction = "text"
submit_action = "set_knowledge_base_name"
hint = "Enter a knowledge base name."

[pages.source_path]
interaction = "text"
submit_action = "create_knowledge_base"
hint = "Enter a local .md, .markdown, or .txt file or directory path."

[pages.indexing]
interaction = "progress"
hint = "Please wait. Input and navigation are disabled while the knowledge base is created."

[routes]
open_knowledge_base_menu = "knowledge_base_menu"
open_existing_knowledge_bases = "existing_knowledge_bases"
open_knowledge_base_creation = "retrieval_type"
existing_knowledge_bases_back = "knowledge_base_menu"
knowledge_base_name_next = "source_path"
database_url_next = "source_type"
database_url_vector_next = "embedding_provider"
embedding_provider = "embedding_provider"
embedding_provider_back = "database_url"
embedding_provider_next = "embedding_model"
embedding_model = "embedding_model"
embedding_model_back = "embedding_provider"
embedding_model_next = "embedding_url"
embedding_url_next = "source_type"
retrieval_type = "retrieval_type"
retrieval_type_back = "knowledge_base_menu"
retrieval_type_next = "database_type"
database_type = "database_type"
database_type_back = "retrieval_type"
database_type_next = "database_url"
source_type = "source_type"
source_type_back = "database_url"
source_type_next = "knowledge_base_name"
knowledge_base_indexing = "indexing"
indexing_failed = "source_path"

# State-machine action names are mapped to trusted, source-controlled handler
# functions. The controller imports these paths only when an action is raised.
[actions.knowledge_base_menu_selection]
menu = "knowledge_base_menu"

[actions.palette_selection]
menu = "palette"

[actions.select_knowledge_base]
handler = "fatbb.cli.actions:select_knowledge_base"

[actions.set_knowledge_base_name]
handler = "fatbb.cli.actions:set_knowledge_base_name"

[actions.set_database_url]
handler = "fatbb.cli.actions:set_database_url"

[actions.set_embedding_provider]
handler = "fatbb.cli.actions:set_embedding_provider"

[actions.set_embedding_model]
handler = "fatbb.cli.actions:set_embedding_model"

[actions.set_embedding_url]
handler = "fatbb.cli.actions:set_embedding_url"

[actions.set_retrieval_type]
handler = "fatbb.cli.actions:set_retrieval_type"

[actions.set_database_type]
handler = "fatbb.cli.actions:set_database_type"

[actions.set_source_type]
handler = "fatbb.cli.actions:set_source_type"

[actions.create_knowledge_base]
handler = "fatbb.cli.actions:create_knowledge_base"

[actions.retrieve]
handler = "fatbb.cli.actions:retrieve"
