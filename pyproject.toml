[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fatbb-agent"
version = "0.1.0"
description = "FatBB knowledge-base retrieval CLI"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "prompt-toolkit>=3.0,<4",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
finetune = [
    "torch>=2.4",
    "transformers>=4.45",
    "peft>=0.12",
    "bitsandbytes>=0.43",
    "datasets>=2.20",
    "accelerate>=0.33",
]

[project.scripts]
fatbb = "fatbb.cli.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fatbb = ["config/*.toml"]
labeling = ["prompts/*.txt"]
labeling_sft = ["system.txt"]
